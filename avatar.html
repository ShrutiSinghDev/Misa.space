<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Select Avatar • MISA</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body class="avatar-body">

  <div class="avatar-container glass-card">

    <div class="avatar-header">
      <h1>Choose Your AI Companion ✨</h1>

      <p>
        Select the personality that will guide your workspace.
      </p>
    </div>

    <div class="avatar-grid">

      <!-- MIRA -->

      <div
        class="avatar-card"
        data-avatar="Mira"
        data-image="assets/avatars/a1.png">

        <img
          src="assets/avatars/a1.png"
          alt="Mira">

        <h3>Mira</h3>

        <p>Elegant strategist AI</p>

      </div>

      <!-- YUKI -->

      <div
        class="avatar-card"
        data-avatar="Yuki"
        data-image="assets/avatars/a2.png">

        <img
          src="assets/avatars/a2.png"
          alt="Yuki">

        <h3>Yuki</h3>

        <p>Calm creative assistant</p>

      </div>

      <!-- KAI -->

      <div
        class="avatar-card"
        data-avatar="Kai"
        data-image="assets/avatars/a3.png">

        <img
          src="assets/avatars/a3.png"
          alt="Kai">

        <h3>Kai</h3>

        <p>Fast futuristic operator</p>

      </div>

    </div>

    <button
      id="continueBtn"
      disabled>
      Continue →
    </button>

  </div>

  <script src="script.js"></script>

</body>
</html>
