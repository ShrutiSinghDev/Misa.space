<!DOCTYPE html>
<html lang="en"> 
  <head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard • MISA.SPACE</title>

    <link rel="stylesheet" href="style.css">

    </head>

    <body class="dashboard-body"> 
      <div class="stars"></div>
       <div class="stars2"></div>
        <div class="stars3"></div>

        <div class="dashboard">

          <aside class="sidebar glass-card">

            <div class="profile-section">

              <img id="profileImage" src="" alt="Avatar">

              <h2 id="profileName">
                Companion
              </h2>

              <p>
                 Your AI Workspace
                 </p>

                 </div>

                 <ul>
                   <li>🏠 Dashboard</li> 
                  <li>💬 AI Chat</li>
                   <li>📅 Tasks</li> 
                   <li>📊 Analytics</li>
                    <li>⚙️ Settings</li>
                   </ul>

                   </aside>

                   <main class="main-content">

                    <div class="top-bar glass-card">

                    <h1 id="welcomeText">
                       Welcome Back ✨
                       </h1>

                       </div>

                       <div class="cards">
                        
                        <div class="card-box glass-card">
                          <h3>📅 Tasks</h3>
                          <p>12 Active Projects</p>
                          </div>

                          <div class="card-box glass-card">
                             <h3>🧠 Meetings</h3> 
                             <p>3 Scheduled Today</p> 
                            </div>

                            <div class="card-box glass-card">
                               <h3>🚀 Productivity</h3>
                                <p>87% Focus Score</p> 
                              </div>

                              </div>

                              <div class="chat-panel glass-card">

                                <div class="chat-box" id="chatBox">

                                  <div class="message ai"> 
                                    
                                    Hello ✨<br><br> 
                                    I'm your MISA assistant.
                                   </div>

                                   </div>

                                   <div class="chat-input">

                                    <input
                                     type="text"
                                      id="chatInput" 
                                      placeholder="Ask MISA something..." >

                                      <button id="sendBtn">
                                         Send 
                                        </button>

                                        </div> 
                                      
                                      </div> 
                                    
                                    </main> 
                                  
                                  </div> 
                                  
                                  <script src="script.js"></script> 
                                
                                </body>
                                
                                </html>
