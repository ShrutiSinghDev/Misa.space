<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login • MISA.SPACE</title>

  <link rel="stylesheet" href="style.css">

</head>

<body class="center-page">

  <div class="glass-card login-card">

    <h2>Welcome Back</h2>

    <p class="subtitle">
      Login to continue into MISA.SPACE
    </p>

    <input
      type="email"
      id="email"
      placeholder="Email">

    <input
      type="password"
      id="password"
      placeholder="Password">

    <button id="loginBtn">
      Enter Workspace
    </button>

  </div>

  <script src="script.js"></script>

</body>
</html>
